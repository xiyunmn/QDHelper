name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        shell: pwsh
        run: sdkmanager --channel=3 'platforms;android-37.0'
      - name: Build compressed APKs without signing secrets
        shell: pwsh
        run: .\gradlew.bat :app:assembleDebug :app:assembleBeta :app:assembleRelease -x lintVitalDebug -x lintVitalBeta -x lintVitalRelease --console=plain
      - name: Prepare APK downloads
        id: apks
        uses: ./.github/actions/prepare-apks
        with:
          channels: debug,beta,release
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.apks.outputs.debug }}
          archive: false
          if-no-files-found: error
      - name: Upload Beta APK
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.apks.outputs.beta }}
          archive: false
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.apks.outputs.release }}
          archive: false
          if-no-files-found: error
