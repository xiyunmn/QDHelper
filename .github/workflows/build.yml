name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set CI version
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Git revision count.' }
          $commit = git rev-parse --short=7 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Git revision.' }
          "ORG_GRADLE_PROJECT_CI_VERSION_NAME=r$count.$commit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Install Android platform
        shell: pwsh
        run: |
          sdkmanager --channel=3 'platforms;android-37.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android platform installation failed.' }
      - name: Decode signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          foreach ($name in 'KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing secret: $name"
            }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'qdhelper-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "RELEASE_KEYSTORE_FILE=$keyPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed and minified APK
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .\gradlew.bat :app:assembleRelease -x lintVitalRelease --console=plain --no-configuration-cache
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'qdhelper-release.jks'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath }
      - name: Prepare APK download
        id: apk
        uses: ./.github/actions/prepare-apks
      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.apk.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: 30
