name: Build signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install SDK
        shell: pwsh
        run: sdkmanager --channel=3 'platforms;android-37.0'
      - name: Decode private signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          foreach ($name in 'KEYSTORE_BASE64','KEYSTORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing secret: $name"
            }
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'qdhelper-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "RELEASE_KEYSTORE_FILE=$keyPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed Release
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .\gradlew.bat :app:assembleRelease -x lintVitalRelease --console=plain --no-configuration-cache
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'qdhelper-release.jks'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath }
      - name: Prepare APK download
        id: apks
        uses: ./.github/actions/prepare-apks
        with:
          channels: release
      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.apks.outputs.release }}
          archive: false
          if-no-files-found: error
