name: Prepare APK download
description: Verify and stage one signed Release APK using its actual build metadata.

outputs:
  apk:
    description: Path to the signed APK.
    value: ${{ steps.prepare.outputs.apk }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $directory = Join-Path $env:GITHUB_WORKSPACE 'app/build/outputs/apk/release'
        $metadata = Get-Content -LiteralPath (Join-Path $directory 'output-metadata.json') -Raw | ConvertFrom-Json
        if ($metadata.variantName -ne 'release' -or @($metadata.elements).Count -ne 1) {
          throw 'Expected exactly one Release APK.'
        }
        $element = $metadata.elements[0]
        $version = [string]$element.versionName
        if ($version -match '^(?<base>[0-9]+\.[0-9]+\.[0-9]+)\.r[0-9]+\.(?<sha>[0-9a-f]{7,40})$') {
          $fileName = "QDHelper-v$($Matches.base)-$($Matches.sha).apk"
        } elseif ($version -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
          $fileName = "QDHelper-v$version-release.apk"
        } else { throw 'Unsupported APK version name.' }
        $sourceName = [string]$element.outputFile
        if ([IO.Path]::GetFileName($sourceName) -ne $sourceName -or $sourceName -notlike '*.apk') {
          throw 'Invalid APK filename.'
        }
        $source = Join-Path $directory $sourceName
        $sdkRoot = $env:ANDROID_HOME
        if ([string]::IsNullOrWhiteSpace($sdkRoot)) { $sdkRoot = $env:ANDROID_SDK_ROOT }
        $signer = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'build-tools') -Directory |
          Sort-Object Name -Descending |
          ForEach-Object { Join-Path $_.FullName 'apksigner.bat' } |
          Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if (!$signer) { throw 'apksigner is unavailable.' }
        & $signer verify $source
        if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
        $destination = Join-Path $env:RUNNER_TEMP 'qdhelper-apk'
        New-Item -ItemType Directory -Path $destination -Force | Out-Null
        $apk = Join-Path $destination $fileName
        Copy-Item -LiteralPath $source -Destination $apk -Force
        "apk=$apk" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "APK: $fileName; versionName: $version; versionCode: $($element.versionCode)" |
          Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
