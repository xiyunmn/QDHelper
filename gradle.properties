# Keep the full verification pipeline (all module tests, lint and Release R8) from
# competing for a tiny default heap.  This is a project-wide baseline, not a
# machine-local override.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
