schema_version = 1

# Every included runtime project and allowed project dependency is declared here.
[[modules]]
path = ":app"
package_prefix = "com.xiyunmn.qdhelper"
plugin = "application"
allowed_dependencies = [":foundation", ":hook-runtime", ":config", ":host-api", ":host-resolver", ":feature-api", ":shared-io", ":shared-ui", ":shared-media", ":settings-api", ":settings-ui", ":capability:free-copy", ":capability:original-image", ":features:startup", ":features:dialogs", ":features:reader", ":features:read-time", ":features:reader-font", ":features:bookshelf", ":features:navigation", ":features:glass-bars", ":features:page-customization", ":features:content-tools", ":features:book-shield", ":features:account", ":features:network-identity", ":features:welfare", ":features:diagnostics", ":features:maintenance", ":shared-compose"]

[[modules]]
path = ":foundation"
package_prefix = "com.xiyunmn.qdhelper.foundation"
plugin = "library"
allowed_dependencies = []

[[modules]]
path = ":hook-runtime"
package_prefix = "com.xiyunmn.qdhelper.hook"
plugin = "library"
allowed_dependencies = [":foundation"]

[[modules]]
path = ":config"
package_prefix = "com.xiyunmn.qdhelper.config"
plugin = "library"
allowed_dependencies = []

[[modules]]
path = ":host-api"
package_prefix = "com.xiyunmn.qdhelper.host.api"
plugin = "library"
allowed_dependencies = []

[[modules]]
path = ":host-resolver"
package_prefix = "com.xiyunmn.qdhelper.host.resolver"
plugin = "library"
allowed_dependencies = [":foundation", ":hook-runtime", ":config", ":host-api"]

# The only module allowed to re-export project dependencies. Feature modules reach :foundation,
# :hook-runtime, :config, :host-api and :settings-api through this umbrella and must not re-declare
# them; a Feature listing :hook-runtime directly is redundant, not a sanctioned escape hatch.
[[modules]]
path = ":feature-api"
package_prefix = "com.xiyunmn.qdhelper.feature.api"
plugin = "library"
allowed_dependencies = [":foundation", ":hook-runtime", ":config", ":host-api", ":settings-api"]
allow_api_project_dependencies = true

[[modules]]
path = ":shared-io"
package_prefix = "com.xiyunmn.qdhelper.shared.io"
plugin = "library"
allowed_dependencies = []

[[modules]]
path = ":shared-fonts"
package_prefix = "com.xiyunmn.qdhelper.shared.fonts"
plugin = "library"
allowed_dependencies = [":foundation", ":config"]

[[modules]]
path = ":shared-ui"
package_prefix = "com.xiyunmn.qdhelper.shared.ui"
plugin = "library"
allowed_dependencies = []

[[modules]]
path = ":shared-media"
package_prefix = "com.xiyunmn.qdhelper.shared.media"
plugin = "library"
allowed_dependencies = [":shared-io"]

[[modules]]
path = ":settings-api"
package_prefix = "com.xiyunmn.qdhelper.settings"
plugin = "library"
allowed_dependencies = [":foundation", ":config"]

[[modules]]
path = ":settings-ui"
package_prefix = "com.xiyunmn.qdhelper.settings.ui"
plugin = "library"
allowed_dependencies = [":foundation", ":feature-api", ":settings-api", ":config", ":host-api", ":shared-ui", ":shared-compose"]

# Capability modules deliberately bypass :feature-api so they stay reusable by more than one Feature.
# That is why they declare :hook-runtime explicitly: they have no umbrella to inherit it from.
[[modules]]
path = ":capability:free-copy"
package_prefix = "com.xiyunmn.qdhelper.capability.freecopy"
plugin = "library"
allowed_dependencies = [":shared-ui", ":shared-compose"]

[[modules]]
path = ":capability:original-image"
package_prefix = "com.xiyunmn.qdhelper.capability.originalimage"
plugin = "library"
allowed_dependencies = [":foundation", ":hook-runtime", ":shared-ui", ":shared-media"]

[[modules]]
path = ":features:startup"
package_prefix = "com.xiyunmn.qdhelper.feature.startup"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-io", ":shared-ui"]

[[modules]]
path = ":features:dialogs"
package_prefix = "com.xiyunmn.qdhelper.feature.dialogs"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:reader"
package_prefix = "com.xiyunmn.qdhelper.feature.reader"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-ui", ":shared-media", ":capability:free-copy"]

[[modules]]
path = ":features:reader-font"
package_prefix = "com.xiyunmn.qdhelper.feature.readerfont"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-io", ":shared-fonts", ":shared-ui"]

[[modules]]
path = ":features:bookshelf"
package_prefix = "com.xiyunmn.qdhelper.feature.bookshelf"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:navigation"
package_prefix = "com.xiyunmn.qdhelper.feature.navigation"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:page-customization"
package_prefix = "com.xiyunmn.qdhelper.feature.pagecustomization"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:content-tools"
package_prefix = "com.xiyunmn.qdhelper.feature.contenttools"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-media", ":shared-io", ":capability:free-copy", ":capability:original-image"]

[[modules]]
path = ":features:book-shield"
package_prefix = "com.xiyunmn.qdhelper.feature.bookshield"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-io", ":shared-ui", ":shared-compose"]

[[modules]]
path = ":features:account"
package_prefix = "com.xiyunmn.qdhelper.feature.account"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:network-identity"
package_prefix = "com.xiyunmn.qdhelper.feature.networkidentity"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:welfare"
package_prefix = "com.xiyunmn.qdhelper.feature.welfare"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:diagnostics"
package_prefix = "com.xiyunmn.qdhelper.feature.diagnostics"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-io", ":shared-ui"]

[[modules]]
path = ":features:read-time"
package_prefix = "com.xiyunmn.qdhelper.feature.readtime"
plugin = "library"
allowed_dependencies = [":feature-api"]

[[modules]]
path = ":features:maintenance"
package_prefix = "com.xiyunmn.qdhelper.feature.maintenance"
plugin = "library"
allowed_dependencies = [":feature-api", ":shared-io"]

[[modules]]
path = ":features:glass-bars"
package_prefix = "com.xiyunmn.qdhelper.feature.glassbars"
